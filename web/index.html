<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic WebMCP · SAP SD</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">RESEARCH PROTOTYPE · READ ONLY</p>
        <h1>從訂單，追到交貨與請款。</h1>
        <p class="lede">以建置期商業語意模型產生 WebMCP 工具，透過 SAP OData 查詢 SD 跨文件流程。</p>
      </div>
      <div class="status-panel">
        <span id="webmcp-status" class="pill neutral">WebMCP 檢查中</span>
        <span id="sap-status" class="pill neutral">SAP 設定檢查中</span>
      </div>
    </header>

    <section class="control-card">
      <div class="variant-copy">
        <label for="variant">實驗組別</label>
        <select id="variant">
          <option value="semantic">C · Semantic Tools</option>
          <option value="typed">B · Typed Tools</option>
          <option value="technical">A · Technical Tools</option>
        </select>
        <p id="variant-note">商業語意、文件關係與唯讀政策皆由模型編譯產生。</p>
      </div>
      <div class="hash-box">
        <span>MODEL VERSION</span>
        <strong id="model-version">—</strong>
        <code id="model-hash">—</code>
      </div>
    </section>

    <section class="workspace">
      <aside class="query-card">
        <h2>查詢條件</h2>
        <form id="query-form">
          <label>銷售訂單編號<input name="sales_order_id" placeholder="例如 0000000001" maxlength="10"></label>
          <label>售達方<input name="sold_to_party_id" maxlength="10"></label>
          <div class="split">
            <label>建立日起<input name="created_from" type="date"></label>
            <label>建立日迄<input name="created_to" type="date"></label>
          </div>
          <div class="split">
            <label>銷售組織<input name="sales_organization" maxlength="4"></label>
            <label>訂單類型<input name="sales_order_type" maxlength="4"></label>
          </div>
          <label>客戶參考編號<input name="customer_reference" maxlength="35"></label>
          <label>筆數上限<input name="limit" type="number" value="20" min="1" max="50"></label>
          <button type="submit">查詢銷售訂單</button>
        </form>
      </aside>

      <section class="result-card">
        <div class="result-heading">
          <div><p class="eyebrow">LIVE RESULT</p><h2 id="result-title">等待查詢</h2></div>
          <div class="actions">
            <button class="secondary" data-operation="get_sales_order">訂單明細</button>
            <button class="secondary" data-operation="get_related_deliveries">關聯交貨</button>
            <button class="secondary" data-operation="get_related_billing_documents">關聯請款</button>
          </div>
        </div>
        <div id="message" class="message">輸入條件，或在支援 Site tools 的瀏覽器中以自然語言要求 Agent 查詢。</div>
        <div class="table-wrap"><table id="results"><thead></thead><tbody></tbody></table></div>
        <footer id="provenance" class="provenance"></footer>
      </section>
    </section>
  </main>
  <script src="/generated/tools.generated.js"></script>
  <script src="/app.js"></script>
</body>
</html>

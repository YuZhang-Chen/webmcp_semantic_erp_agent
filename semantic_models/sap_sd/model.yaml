      sales_order_id: {property: SalesOrder, status: tenant_verified, edm_type: Edm.String, max_length: 10}
    output_fields:
      sales_order_id: {property: SalesOrder, status: tenant_verified, edm_type: Edm.String, max_length: 10}
      customer_id: {property: SoldToParty, status: tenant_verified, edm_type: Edm.String, max_length: 10}
      order_date: {property: SalesOrderDate, status: tenant_verified, edm_type: Edm.DateTime, max_length: null}
      order_status: {property: OverallSDProcessStatus, status: tenant_verified, edm_type: Edm.String, max_length: 1, code_map: {A: not_started, B: partially_completed, C: completed}, code_map_status: official_documented, tenant_observed_codes: [C]}

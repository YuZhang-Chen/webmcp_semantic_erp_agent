[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmcp-semantic-erp-agent"
version = "0.1.0"
description = "Governed SAP SD semantic model validation prototype"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
semantic-model = "semantic_model.cli:main"
phase07-experiment = "experiment.cli:main"
phase08-experiment = "experiment.phase08_cli:main"
phase08-budget-experiment = "experiment.budget_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_model", "src/experiment"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
